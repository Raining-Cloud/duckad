model:
  head: gru

data:
  dir: data/final
  test_dir: data/test
  batch_size: 64
  num_workers: 8
  augment: true
  background_aug: true

optim:
  epochs: 20
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  command_perturb_prob: 0.3
  imagenet_stop_prob: 0.0
  train_bev: true

runtime:
  seed: 0
  device: "cuda"
  runname: "gru"
